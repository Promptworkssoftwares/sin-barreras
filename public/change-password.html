<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#132427">
  <title>Crear contraseña personal · Sin Barreras</title>
  <link rel="stylesheet" href="/css/landing.css?v=1.7.7">
  <link rel="stylesheet" href="/css/account-pages.css?v=1.7.7">
</head>
<body class="account-page-body">
  <main class="account-page-shell">
    <a class="account-page-brand" href="/"><img src="/assets/sin-barreras-logo-full.png" alt="Sin Barreras"></a>
    <section class="account-page-card">
      <span class="eyebrow">PRIMER ACCESO</span>
      <h1>Crea tu contraseña personal.</h1>
      <p>El Owner te dio una contraseña temporal. Antes de usar Sin Barreras, crea una contraseña que solo tú conozcas.</p>
      <form id="temporary-password-form" class="account-form">
        <label><span>Nueva contraseña</span><input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <label><span>Confirmar contraseña</span><input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <label class="legal-consent"><input id="temporary-terms" type="checkbox" required><span>Confirmo que tengo 18 años o más y acepto los <a href="/terms" target="_blank" rel="noopener">Términos</a> y la <a href="/privacy" target="_blank" rel="noopener">Política de Privacidad</a>.</span></label>
        <button id="temporary-password-submit" class="cta-primary" type="submit">GUARDAR Y CONTINUAR <span>→</span></button>
      </form>
      <div id="temporary-password-status" class="auth-status is-hidden" role="status"></div>
      <button id="temporary-password-logout" class="text-action" type="button">Cerrar sesión</button>
    </section>
  </main>
  <script type="module" src="/js/change-password.js?v=1.7.7"></script>
</body>
</html>
