<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132427">
  <title>Restablecer contraseña · Sin Barreras</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/landing.css?v=1.6.2">
  <link rel="stylesheet" href="/css/account-pages.css?v=1.6.2">
</head>
<body class="account-page-body">
  <main class="account-page-shell">
    <a class="account-page-brand" href="/"><img src="/assets/sin-barreras-logo-full.png" alt="Sin Barreras"></a>
    <section class="account-page-card">
      <span class="auth-kicker">SEGURIDAD DE CUENTA</span>
      <h1>Nueva contraseña</h1>
      <p>Elige una contraseña de al menos 10 caracteres. El enlace solo puede usarse una vez.</p>
      <div id="reset-status" class="auth-status is-hidden" role="status"></div>
      <form id="reset-password-form" class="account-form">
        <label>Nueva contraseña<input id="new-password" type="password" autocomplete="new-password" minlength="10" required></label>
        <label>Confirmar contraseña<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required></label>
        <button class="cta-primary" type="submit">GUARDAR CONTRASEÑA <span>→</span></button>
      </form>
      <a class="account-page-link" href="/">← Volver a iniciar sesión</a>
    </section>
  </main>
  <script type="module" src="/js/reset-password.js?v=1.6.2"></script>
</body>
</html>
